<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><link rel="icon" href="crest.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style><script src="config.js"></script></head><body><title>Listening to Our Team</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a quiet listening room. One question at a time, a single speak-or-type composer, a reward card that fills as people talk.
   Malaika Path control room behind a hamburger: summary first, then gaps, voices and recommendations. */
:root{
  --bg:#F6F4F0; --surface:#FFFFFF; --sunk:#EEEAE3; --line:#DED7CC; --ink:#231A15; --muted:#6B5F57;
  --brand:#B4441B; --brand-ink:#FFFFFF; --brand-soft:#F8E4D8; --band:#2B1A13; --band-ink:#F6EEE7; --band-muted:#C9B3A4;
  --gold:#C98A12; --gold-soft:#F7ECD3; --gold-ink:#5A3D05;
  --ok:#1E7A4C; --ok-soft:#DCF1E5; --warn:#A35B00; --warn-soft:#FBEBD5; --bad:#B4352A; --bad-soft:#F8E1DE; --info:#2C5F8A; --info-soft:#E1ECF6;
  --ug1:#111111; --ug2:#F2C300; --ug3:#D21F26;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17110E; --surface:#211915; --sunk:#1B1411; --line:#3A2D26; --ink:#F2E9E2; --muted:#B3A398;
  --brand:#F08A4B; --brand-ink:#2A1206; --brand-soft:#3D2418; --band:#100A07; --band-ink:#F2E9E2; --band-muted:#A8968A;
  --gold:#E8B54F; --gold-soft:#3A2D12; --gold-ink:#F6DCA4;
  --ok:#5CC98E; --ok-soft:#163327; --warn:#F0A64A; --warn-soft:#3A2810; --bad:#F07F72; --bad-soft:#3D1A17; --info:#7FB3E0; --info-soft:#17293A;
  --ug1:#F2E9E2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17110E; --surface:#211915; --sunk:#1B1411; --line:#3A2D26; --ink:#F2E9E2; --muted:#B3A398;
  --brand:#F08A4B; --brand-ink:#2A1206; --brand-soft:#3D2418; --band:#100A07; --band-ink:#F2E9E2; --band-muted:#A8968A;
  --gold:#E8B54F; --gold-soft:#3A2D12; --gold-ink:#F6DCA4;
  --ok:#5CC98E; --ok-soft:#163327; --warn:#F0A64A; --warn-soft:#3A2810; --bad:#F07F72; --bad-soft:#3D1A17; --info:#7FB3E0; --info-soft:#17293A;
  --ug1:#F2E9E2; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:760px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hint{font-size:14px;color:var(--muted)}
.btn{text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.small{padding:7px 11px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{background:var(--bad-soft);color:var(--bad);padding:11px 14px;border-radius:10px;font-size:14.5px}
.note{background:var(--gold-soft);color:var(--gold-ink);padding:11px 14px;border-radius:10px;font-size:14.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-none{background:var(--sunk);color:var(--muted)} .p-gold{background:var(--gold-soft);color:var(--gold-ink)}
.demo{background:var(--gold-soft);color:var(--gold-ink);font-size:13.5px;padding-block:8px}

/* ---------- brand band ---------- */
.band{background:var(--band);color:var(--band-ink)}
.band .wrap{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.flag{height:4px;background:linear-gradient(90deg,var(--ug1) 0 33.3%,var(--ug2) 33.3% 66.6%,var(--ug3) 66.6%)}
.lockup{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.mp-mark{width:40px;height:40px;flex:none;border-radius:10px;background:#fff;padding:2px;display:grid;place-items:center;overflow:hidden}
.mp-mark img{width:100%;height:100%;object-fit:contain}
.lock-text{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.lock-text b{font-family:var(--display);font-size:16px;letter-spacing:.02em}
.lock-text span{font-size:12.5px;color:var(--band-muted);overflow:hidden;text-overflow:ellipsis}
.partner{display:flex;align-items:center;gap:10px;text-align:right;line-height:1.25;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--band-muted)}
.partner b{color:var(--band-ink);font-weight:600;display:block}
.crest{width:48px;height:50px;flex:none;display:grid;place-items:center}
.crest img{width:100%;height:100%;object-fit:contain}
.band .btn{background:transparent;color:var(--band-ink);border-color:rgba(255,255,255,.2)}

/* ---------- participant ---------- */
.hero{padding-block:34px 18px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
.hero h1{font-size:clamp(34px,5.4vw,58px);font-weight:800;letter-spacing:-.015em}
.hero h1 em{font-style:normal;color:var(--brand)}
.lede{font-size:18px;max-width:58ch;margin-top:14px}
.promises{display:grid;gap:10px;margin-top:20px}
.promise{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:15.5px}
.promise i{width:28px;height:28px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:14px}
.reward{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.reward .ticket{display:flex;gap:14px;align-items:center}
.cup{width:64px;height:64px;flex:none}
.reward h3{font-size:21px}
.tiers{display:grid;gap:8px;font-size:14.5px}
.tier{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.tier b{font-family:var(--mono);font-size:12px;padding:2px 7px;border-radius:6px;background:var(--gold);color:#fff;white-space:nowrap}
.tier.t2 b{background:var(--muted)}
.race{display:grid;gap:8px}
.race-row{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:14px}
.race-row .bar{grid-column:1/-1}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.form{padding:26px;display:grid;gap:16px;margin-block:26px 60px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:600;font-size:15px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 13px;width:100%;font-size:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--brand);flex:none}

.qtop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:22px 8px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots span{width:34px;height:6px;border-radius:99px;background:var(--line)}
.dots span.on{background:var(--brand)} .dots span.now{background:var(--gold)}
.qcard{padding-block:6px 60px;display:grid;gap:18px}
.qnum{font-family:var(--mono);font-size:13px;color:var(--brand);font-weight:700}
.qcard h2{font-size:clamp(26px,3.8vw,38px);font-weight:700;letter-spacing:-.01em}
.qprompt{font-size:17px;color:var(--muted);max-width:62ch}
.nudges{display:flex;flex-wrap:wrap;gap:8px}
.nudge{border:1px dashed var(--line);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted);background:transparent}
.composer{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s}
.composer:focus-within{border-color:var(--brand)}
.composer.rec{border-color:var(--bad)}
.composer textarea{border:0;background:transparent;resize:none;min-height:150px;max-height:55vh;width:100%;font-size:17px;line-height:1.6;padding:4px 6px;outline:none}
.live{min-height:150px;padding:4px 6px;font-size:17px;line-height:1.6}
.live .interim{color:var(--muted)}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ctrl-left{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;flex-wrap:wrap}
.ctrl-left select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;font-size:13px}
.round{width:52px;height:52px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;flex:none}
.round svg{width:24px;height:24px}
.mic{background:var(--brand);color:var(--brand-ink)}
.cancel{background:var(--sunk);color:var(--ink)}
.tick{background:var(--ok);color:#fff}
.recbar{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:14px;color:var(--bad);font-weight:700}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.25}}
.wave{display:flex;gap:3px;align-items:center;height:22px}
.wave i{width:3px;background:var(--bad);border-radius:2px;height:30%;animation:wv 1s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes wv{50%{height:100%}}
.depth{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center}
.depth .segs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.depth .segs i{height:7px;border-radius:99px;background:var(--line)}
.depth .segs i.on{background:var(--gold)}
.depth .segs.full i.on{background:var(--ok)}
.depth b{font-size:14px}
.qfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.review{display:grid;gap:12px;margin-block:16px 60px}
.rv{padding:16px 18px;display:grid;gap:6px}
.rv-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.rv p{white-space:pre-wrap;font-size:15px}
.welcome{padding-block:44px 30px;display:grid;justify-items:center;text-align:center;gap:12px}
.big-crest{width:96px;height:auto}
.welcome .dir{font-size:16px;color:var(--muted);max-width:52ch}
.welcome .dir b{color:var(--ink)}
.welcome h1{font-size:clamp(36px,6vw,60px);font-weight:800;letter-spacing:-.015em;margin-top:6px}
.welcome h1 em{font-style:normal;color:var(--brand)}
.welcome .lede{font-size:18px;color:var(--muted);margin-top:0}
.cta-col{display:grid;gap:10px;width:min(320px,100%);margin-top:10px}
.btn.big{padding:15px 22px;font-size:17px}
.why{max-width:60ch;text-align:left;font-size:15px;color:var(--muted)}
.why summary{cursor:pointer;font-weight:600;color:var(--ink);text-align:center}
.why p{margin-top:8px}
.powered{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:12px}
.powered img{width:28px;height:28px;object-fit:contain;border-radius:6px;background:#fff}
.pcode{font-family:var(--mono);font-size:38px;font-weight:700;letter-spacing:.18em;background:var(--gold-soft);color:var(--gold-ink);padding:14px 22px;border-radius:14px}
.reveal{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.94);opacity:.4}100%{transform:none;opacity:1}}
.done{padding-block:40px 60px;display:grid;gap:22px;text-align:left}
.voucher{border:2px dashed var(--gold);background:var(--gold-soft);color:var(--gold-ink);border-radius:18px;padding:22px;display:grid;gap:10px}
.voucher code{font-family:var(--mono);font-size:26px;letter-spacing:.12em;font-weight:700}
.share{display:flex;gap:10px;flex-wrap:wrap}
.linkbox{font-family:var(--mono);font-size:13px;background:var(--sunk);padding:8px 10px;border-radius:8px;word-break:break-all;user-select:all}
footer{color:var(--muted);font-size:13px;padding-block:22px 34px;border-top:1px solid var(--line);margin-top:30px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- Malaika Path control room ---------- */
.adm-bar{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.adm-bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.burger{width:42px;height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:transparent;color:var(--band-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.adm-title{display:flex;flex-direction:column;line-height:1.2;min-width:0;flex:1}
.adm-title b{font-family:var(--display);font-size:18px}
.adm-title span{font-size:12.5px;color:var(--band-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-scrim{position:fixed;inset:0;background:rgba(5,15,12,.5);z-index:40}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--surface);z-index:41;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;overflow:auto;box-shadow:0 0 40px rgba(0,0,0,.2)}
.drawer a{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border-radius:10px;color:inherit;text-decoration:none;font-weight:600;cursor:pointer}
.drawer a:hover{background:var(--sunk)}
.drawer a[aria-current="true"]{background:var(--brand-soft);color:var(--brand)}
.drawer small{font-family:var(--mono);color:var(--muted);font-weight:500}
.sec-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;padding-block:24px 14px}
.sec-head h2{font-size:clamp(24px,3vw,32px);font-weight:800}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14px;max-width:100%}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0}
.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.panel-head h3{font-size:18px}
.panel-body{padding:16px 18px}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-top:16px}
.stack{display:grid;gap:16px;margin-top:16px;padding-bottom:50px}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
td.r,th.r{text-align:right}
.unitrow{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(0,1.5fr) 56px 44px;gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line);font-size:14.5px}
.unitrow:last-child{border-bottom:0}
.unitrow .bar{height:10px}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--gold-soft);color:var(--gold-ink);margin-left:6px;white-space:nowrap}
.heat td{text-align:center;font-family:var(--mono);font-size:13px;font-weight:700;border:2px solid var(--surface);border-radius:6px}
.heat th{white-space:normal;font-size:11px;min-width:84px}
.heat td:first-child{text-align:left;font-family:var(--body);font-weight:600;white-space:nowrap}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:4px 12px;align-items:center;font-size:14px;padding-block:6px}
.hbar .bar{grid-column:1/-1;height:8px}
.hbar .bar i{background:var(--gold)}
.quote{border-left:3px solid var(--brand);padding:6px 0 6px 14px;display:grid;gap:4px}
.quote p{font-size:15.5px}
.quote span{font-size:12.5px;color:var(--muted)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.rec{display:grid;gap:12px;padding:18px}
.rec-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.rec h3{font-size:20px}
.rec ul{margin:0;padding-left:20px;display:grid;gap:6px}
.spine{background:var(--brand-soft);color:var(--brand);padding:10px 12px;border-radius:10px;font-size:14.5px}
.rec textarea,.set textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;min-height:70px;resize:vertical}
.set{display:grid;gap:16px;padding:18px}
.set input,.set select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
.qedit{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.logo-slot{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo-slot .prev{width:64px;height:64px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.logo-slot .prev img{width:100%;height:100%;object-fit:contain}

/* =====================================================================
   DATA LAYER: Apps Script (live) · remote fetch (live elsewhere) · preview
   ===================================================================== */
const GAS = typeof google !== 'undefined' && google.script && google.script.run;
const MODE = GAS ? 'live' : (API_URL ? 'remote' : 'preview');
function gas(fn, args){ return new Promise((res, rej) => google.script.run.withSuccessHandler(r => r && r.error ? rej(new Error(r.error)) : res(r && r.ok ? r.data : r)).withFailureHandler(e => rej(new Error(e && e.message || String(e))))[fn](...args)); }
async function remote(fn, args){
  const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({fn, args})});
  const j = await r.json(); if(j.error) throw new Error(j.error); return j.data;
}
const api = (fn, ...args) => MODE === 'live' ? gas(fn, args) : MODE === 'remote' ? remote(fn, args) : Preview[fn](...args);

/* ---------- preview backend (this browser only) ---------- */
const LS = { get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const Preview = {
  db(){ let d = LS.get('lt-preview2', null); if(!d){ d = {responses:sampleResponses(), vouchers:sampleVouchers(), settings:{}}; LS.set('lt-preview2', d); } return d; },
  put(d){ LS.set('lt-preview2', d); },
  give(d, r){ const rg = rungOf(r.tier) || {};
    if(rg.auto){ r.voucher = 'LEISH-' + Math.random().toString(36).slice(2,7).toUpperCase(); r.rewardStatus = 'Voucher sent'; return; }
    const v = d.vouchers.find(x=>x.tier===r.tier && x.status==='available');
    if(v){ v.status='issued'; v.assignedTo=r.email; v.assignedName=r.name; v.assignedAt=new Date().toISOString(); r.voucher=v.code; r.rewardStatus='Voucher sent'; } else r.rewardStatus='Unlocked, voucher to follow'; },
  async apiPublic(){ const d = this.db(), units = {}; d.responses.filter(r=>r.status==='submitted').forEach(r => units[r.unit] = (units[r.unit]||0)+1);
    return {settings:d.settings, units, total:d.responses.filter(r=>r.status==='submitted').length}; },
  async apiSignup(p){ const d = this.db(), email = String(p.email||'').trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('Please check your email address.');
    if(d.responses.some(r => r.email === email)) throw new Error('This email is already signed up. Use "I have my code" to continue.');
    const ver = String(cfg().allowedDomains).split(/[,\s]+/).filter(Boolean).some(x => email.endsWith('@'+x));
    const code = Math.random().toString(36).slice(2,8).toUpperCase();
    const r = {id:'r'+Math.random().toString(36).slice(2,11), created:new Date().toISOString(), updated:new Date().toISOString(), status:'in_progress', mode:p.mode==='interviewer'?'Interviewer-led':'Self-completed', interviewer:p.interviewer||'', name:p.name.trim(), email, title:p.title.trim(), unit:p.unit, level:levelFromTitle(p.title), phone:p.phone||'', ref:p.ref||'', verified:ver?'yes':'no', dupFlag:'', code, sample:false};
    d.responses.push(r); this.put(d); return {id:r.id, code, emailed:true}; },
  async apiLogin(email, code){ const d = this.db(), r = d.responses.find(x => x.email === String(email).trim().toLowerCase());
    if(!r || String(r.code).toUpperCase() !== String(code).trim().toUpperCase()) throw new Error('That email and code do not match. Check the code in your email.');
    if(r.status === 'submitted') return {done:true, tier:r.tier, rewardStatus:r.rewardStatus, voucher:r.voucher, name:r.name};
    return {id:r.id, answers:[1,2,3,4,5,6].map(i=>r['a'+i]||''), profile:{name:r.name, email:r.email, title:r.title, unit:r.unit}}; },
  async apiChangeCode(id, code){ if(String(code).trim().length < 4) throw new Error('Use at least 4 letters or numbers.'); const d = this.db(); d.responses.find(x=>x.id===id).code = String(code).trim().toUpperCase(); this.put(d); return true; },
  async apiResendCode(email){ return true; },
  async apiSave(id, q, text){ const d = this.db(), r = d.responses.find(x=>x.id===id); if(!r) throw new Error('Session not found.');
    r['a'+q] = text; r['w'+q] = wc(text); r.updated = new Date().toISOString(); r.depth = depthOf(r); this.put(d); return {saved:r.updated, depth:r.depth}; },
  async apiSubmit(id){ const d = this.db(), r = d.responses.find(x=>x.id===id); if(r.status==='submitted') return r;
    r.depth = depthOf(r); r.updated = new Date().toISOString();
    if(r.mode==='Interviewer-led'){ r.tier='none'; r.rewardStatus='Not eligible (interviewer-led)'; }

      if(r.verified!=='yes' && cfg().approveUnverified) r.rewardStatus = 'Awaiting approval'; else this.give(d, r); }
    r.status = 'submitted'; this.put(d); return {tier:r.tier, rewardStatus:r.rewardStatus, voucher:r.voucher, depth:r.depth}; },
  async apiAdmin(key){ if(key !== 'preview') throw new Error('In this preview the password is: preview'); const d = this.db(); return {settings:d.settings, responses:d.responses, vouchers:d.vouchers, staff:0, audit:[], sheetUrl:''}; },
  async apiAdminSaveSettings(key, obj){ const d = this.db(); Object.assign(d.settings, obj); this.put(d); return true; },

  async apiAdminResend(){ return true; },
  async apiAdminDelete(key, id){ const d = this.db(); d.responses = d.responses.filter(x=>x.id!==id); this.put(d); return true; },
  async apiAdminRelease(key){ const d = this.db(); d.settings.rewardsLive = true; SETTINGS.rewardsLive = true; let n = 0;
    d.responses.filter(r=>r.status==='submitted'&&r.rewardStatus==='Rewards not open yet').sort((a,b)=>String(a.updated).localeCompare(String(b.updated))).forEach(r => { r.tier = pickRung(d.responses, Number(r.depth) >= cfg().fullThreshold); if(r.verified!=='yes' && cfg().approveUnverified) r.rewardStatus='Awaiting approval'; else this.give(d, r); n++; });
    this.put(d); return {released:n}; },
  async apiAdminSetStatus(key, id, st){ const d = this.db(); d.responses.find(x=>x.id===id).rewardStatus = st; this.put(d); return true; },
  async apiAdminAddVouchers(key, tier, text){ const d = this.db(), codes = text.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean); let sent = 0;

    this.put(d); return {added:codes.length, sent}; }

const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function cfg(){ const s = Object.assign({}, DEFAULTS, SETTINGS); s.questions = (SETTINGS.questions && SETTINGS.questions.length) ? SETTINGS.questions : DEFAULTS.questions; return s; }

let PARAMS = null;
function params(){ if(PARAMS) return PARAMS; const p = new URLSearchParams(location.search); const h = location.hash.replace('#',''); return {view: p.get('view') || (h==='admin'||h==='interview' ? h : ''), ref: p.get('ref') || ''}; }
function levelFromTitle(t){ t = String(t||'').toLowerCase();
  if(/assistant commissioner|principal|head of|manager|senior/.test(t)) return 'Management';
  if(/commissioner|director|permanent secretary|minister/.test(t)) return 'Leadership';
  if(/record|\bit\b|ict|driver|secretar|clerk|attendant|account|typist|steno|librar|reception|store|admin assistant|office assistant|askari|security/.test(t)) return 'Support / IT / Records';
  return 'Officer'; }
function ladder(){ const l = cfg().rewards; return (Array.isArray(l) && l.length) ? l : DEFAULTS.rewards; }
function rungOf(key){ const L = ladder(); return L.find(x => x.key === key) || null; }
function rungName(key){ const r = rungOf(key); return r ? r.name : (key === 'none' ? 'No reward (interviewer-led)' : ''); }
function pickRung(list, full){ const L = ladder(); if(!full) return L[L.length-1].key; const taken = {};
  list.filter(x => x.status === 'submitted').forEach(x => taken[x.tier] = (taken[x.tier]||0)+1);
  const r = L.find(x => !Number(x.count) || (taken[x.key]||0) < Number(x.count)); return (r || L[L.length-1]).key; }
function depthOf(r){ const qs = cfg().questions; let s = 0; for(let i=0;i<5;i++){ s += Math.min((wc(r['a'+(i+1)]))/((qs[i]&&qs[i].t)||50),1)*20; } return Math.round(s); }

function brandBand(right){
  const s = cfg();
  const crest = s.logoMinistry || CREST, mp = s.logoMP || MP_LOGO;
  return `<div class="band"><div class="wrap">
    <div class="lockup"><span class="crest"><img src="${esc(crest)}" alt="Coat of arms of Uganda"></span><span class="lock-text"><b>${esc(s.shortName || 'Directorate')}</b><span>${esc(s.ministryName)}</span></span></div>
    <div class="partner"><span>Powered by</span><span class="mp-mark"><img src="${esc(mp)}" alt="Malaika Path"></span></div>
    ${right||''}</div></div><div class="flag"></div>`;
}
function footerHtml(){ const s = cfg(); return `<footer><div class="wrap"><span>${esc(s.shortName)} · ${esc(s.ministryName)} · Powered by Malaika Path</span><span>Questions? Call the ${esc(s.contactName)} on <b class="num">${esc(s.contactPhone)}</b></span></div></footer>`; }

const P = { pub:null, profile:null, id:null, answers:['','','','','',''], q:0, interviewer:false, result:null };
function store(){ LS.set('lt-session', {profile:P.profile, id:P.id, answers:P.answers, q:P.q}); }

async function bootParticipant(interviewer){
  P.interviewer = interviewer;
  const saved = LS.get('lt-session', null);
  if(saved && saved.id){ Object.assign(P, saved); }
  try{ P.pub = await api('apiPublic'); SETTINGS = P.pub.settings || {}; }catch(e){ P.pub = {units:{}, total:0}; }
  if(P.id && P.profile && !P.result) return renderQuestion();
  renderWelcome();
}
function renderWelcome(){
  const s = cfg();
  $('#root').innerHTML = brandBand() + `<main class="wrap narrow">

      <img class="big-crest" src="${esc(s.logoMinistry || CREST)}" alt="Coat of arms of Uganda">

      <h1>Your work, <em>in your own words.</em></h1>
      <p class="lede">Six questions. About 15 minutes. Speak or type.<br>Not a test. Confidential. Here to make your work easier.</p>
      ${P.interviewer ? '<p class="note">Interviewer-led session</p>' : ''}
      <div class="cta-col">
        <button class="btn primary big" id="begin" type="button">Start</button>
        <button class="btn" id="signin" type="button">I have my code</button>
      </div>
      <details class="why"><summary>Why are we asking?</summary><p>${esc(s.intro)}</p><p>Only the Malaika Path project team reads full answers. Reports show units, never names.</p></details>

let REC = null;
function renderQuestion(){
  stopRec(true);
  const s = cfg(), i = P.q, Q = s.questions[i];
  if(!Q) return renderReview();
  const text = P.answers[i] || '';
  $('#root').innerHTML = brandBand() + `<main class="wrap narrow">
    <div class="qtop"><div class="dots" aria-label="Question ${i+1} of ${s.questions.length}">${s.questions.map((_,k)=>`<span class="${k<i && P.answers[k].trim()?'on':''} ${k===i?'now':''}"></span>`).join('')}</div>
      <span class="hint">Hello ${esc((P.profile.name||'').split(' ')[0])} · ${esc(P.profile.unit)}</span></div>
    <section class="qcard">
      <span class="qnum">QUESTION ${i+1} OF ${s.questions.length}${Q.optional?' · OPTIONAL':''}</span>
      <h2>${esc(Q.q)}</h2>
      <p class="qprompt">${esc(Q.p)}</p>
      ${Q.n && Q.n.length ? `<div class="nudges" aria-label="Ideas to talk about">${Q.n.map(x=>`<span class="nudge">${esc(x)}</span>`).join('')}</div>` : ''}
      <div class="composer" id="composer">
        <textarea id="ans" aria-label="Your answer" placeholder="Tap the microphone and talk, or type here. Say it the way you would explain it to a friend. The more detail, the better.">${esc(text)}</textarea>
        <div id="live" class="live" hidden></div>
        <div class="ctrl" id="ctrl"></div>
      </div>
      <div id="micTip" class="note" hidden></div>
      ${Q.t ? `<div class="depth" id="depth"></div>` : ''}
      <div id="qerr" class="err" hidden></div>
      <div class="qfoot">
        <button class="btn ghost" type="button" id="prev">${i===0 ? '← Back' : '← Previous question'}</button>
        <button class="btn primary" type="button" id="next">${i===s.questions.length-1 ? 'Save and review' : 'Save and next question →'}</button>
      </div>
    </section></main>` + footerHtml();
  const ta = $('#ans');
  autoGrow(ta); ta.oninput = () => { P.answers[i] = ta.value; autoGrow(ta); paintDepth(); store(); };
  paintCtrl(); paintDepth();
  $('#prev').onclick = async () => { await saveCurrent(false); if(i===0){ renderWelcome(); } else { P.q--; store(); renderQuestion(); } };
  $('#next').onclick = async () => {
    if(REC) acceptRec();
    const v = (P.answers[i]||'').trim();
    if(!Q.optional && wc(v) < 5){ const e = $('#qerr'); e.textContent = 'Please share a little more before moving on. A few sentences is fine, and speaking is quickest.'; e.hidden = false; return; }
    if(!(await saveCurrent(true))) return;
    P.q++; store(); window.scrollTo({top:0}); renderQuestion();
  };
}
function autoGrow(t){ t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 4, window.innerHeight * .55) + 'px'; }
async function saveCurrent(showErr){
  const i = P.q, btn = $('#next');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  try{ await api('apiSave', P.id, i+1, P.answers[i]||''); return true; }
  catch(e){ if(showErr){ const el = $('#qerr'); el.textContent = 'Not saved: ' + e.message + ' Check your connection and try again. Your words are kept on this device.'; el.hidden = false; } return false; }
  finally{ if(btn){ btn.disabled = false; btn.textContent = P.q === cfg().questions.length-1 ? 'Save and review' : 'Save and next question →'; } }
}
function paintDepth(){
  const el = $('#depth'); if(!el) return; const Q = cfg().questions[P.q]; const n = wc(P.answers[P.q]); const r = n / (Q.t||50);
  const lvl = r >= 1 ? 3 : r >= .6 ? 2 : n > 0 ? 1 : 0;
  const label = ['Not started yet','A start. Tell us more, with an example.','Good. A little more detail makes it complete.','Rich, full answer. Thank you.'][lvl];
  el.innerHTML = `<span class="segs ${lvl===3?'full':''}"><i class="${lvl>=1?'on':''}"></i><i class="${lvl>=2?'on':''}"></i><i class="${lvl>=3?'on':''}"></i></span><b>${label}</b><span></span><span class="hint num">${n} words · the more detail, the better</span>`;
}

/* ---------- voice: speak, cancel or tick ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const LANGS = [['en-GB','English'],['sw-KE','Kiswahili']];
function paintCtrl(){
  const c = $('#ctrl'); if(!c) return;
  const lang = LS.get('lt-lang','en-GB');
  if(REC){
    c.innerHTML = `<div class="ctrl-left"><span class="recbar"><span class="pulse"></span><span id="timer">0:00</span></span><span class="wave"><i></i><i></i><i></i><i></i><i></i></span><span>Listening… speak freely</span></div>
      <div style="display:flex;gap:10px"><button class="round cancel" id="rcCancel" type="button" aria-label="Cancel this recording">${ICON.x}</button><button class="round tick" id="rcTick" type="button" aria-label="Keep what I said">${ICON.tick}</button></div>`;
    $('#rcCancel').onclick = () => stopRec(true); $('#rcTick').onclick = acceptRec;
  } else {
    c.innerHTML = `<div class="ctrl-left"><span>${SR ? 'Tap to speak' : 'Type, or use the microphone on your keyboard'}</span>${SR ? `<select id="lang" aria-label="Speaking language">${LANGS.map(l=>`<option value="${l[0]}" ${lang===l[0]?'selected':''}>${l[1]}</option>`).join('')}</select>` : ''}</div>
      <button class="round mic" id="micBtn" type="button" aria-label="Speak your answer">${ICON.mic}</button>`;
    const l = $('#lang'); if(l) l.onchange = () => LS.set('lt-lang', l.value);
    $('#micBtn').onclick = startRec;
  }
}
function micTip(msg){ const t = $('#micTip'); if(!t) return; t.innerHTML = msg; t.hidden = false; }
function startRec(){
  if(!SR){ micTip('<b>Speak using your keyboard.</b> Tap inside the answer box, then tap the microphone on your phone keyboard. It works in English and Kiswahili.'); $('#ans').focus(); return; }
  const rec = new SR(); rec.lang = LS.get('lt-lang','en-GB'); rec.continuous = true; rec.interimResults = true;
  REC = {rec, final:'', interim:'', start:Date.now(), alive:true};
  rec.onresult = ev => { let interim = ''; for(let k=ev.resultIndex;k<ev.results.length;k++){ const r = ev.results[k]; if(r.isFinal) REC.final += r[0].transcript.trim() + ' '; else interim += r[0].transcript; } REC.interim = interim; paintLive(); };
  rec.onerror = ev => { if(ev.error === 'language-not-supported'){ stopRec(true); micTip('<b>This phone cannot turn that language into text yet.</b> Tap inside the answer box and use the microphone on your keyboard, or choose another language.'); return; }
    if(ev.error === 'not-allowed' || ev.error === 'service-not-allowed' || ev.error === 'audio-capture'){ stopRec(true); micTip('<b>This browser did not allow the microphone here.</b> Tap inside the answer box and use the microphone on your phone keyboard instead. It works just as well.'); } };
  rec.onend = () => { if(REC && REC.alive){ try{ rec.start(); }catch(e){} } };
  try{ rec.start(); }catch(e){ REC = null; return micTip('The microphone could not start. Use the microphone on your keyboard instead.'); }
  $('#composer').classList.add('rec'); $('#ans').hidden = true; $('#live').hidden = false; paintLive(); paintCtrl();
  REC.timer = setInterval(() => { const s = Math.floor((Date.now()-REC.start)/1000); const t = $('#timer'); if(t) t.textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); if(s >= 300) acceptRec(); }, 500);
}
function paintLive(){ const l = $('#live'); if(!l || !REC) return; const base = (P.answers[P.q]||'').trim();
  l.innerHTML = (base ? esc(base) + ' ' : '') + `<span>${esc(REC.final)}</span><span class="interim">${esc(REC.interim)}</span>` + (!REC.final && !REC.interim ? '<span class="interim">Start speaking. Your words appear here.</span>' : ''); }
function stopRec(discard){
  if(!REC) return; REC.alive = false; clearInterval(REC.timer); try{ REC.rec.stop(); }catch(e){}
  const said = (REC.final + ' ' + REC.interim).trim(); REC = null;
  const c = $('#composer'); if(c){ c.classList.remove('rec'); $('#ans').hidden = false; $('#live').hidden = true; paintCtrl(); }
  return discard ? '' : said;
}
function acceptRec(){
  const said = stopRec(false); if(!said) return;
  const base = (P.answers[P.q]||'').trim(); P.answers[P.q] = (base ? base + ' ' : '') + said.charAt(0).toUpperCase() + said.slice(1);
  const ta = $('#ans'); ta.value = P.answers[P.q]; autoGrow(ta); paintDepth(); store();
  toast('Added. Read it through, correct anything, then save.');
}

/* ---------- review and submit ---------- */
function renderReview(err){
  const s = cfg(), r = {}; P.answers.forEach((a,k)=>r['a'+(k+1)] = a);
  $('#root').innerHTML = brandBand() + `<main class="wrap narrow">

  };
}

   recs:['Agree a short Directorate charter of how we work together, written with staff, not for them.','Open regular two-way channels: monthly town halls and a visible “you said, we did” board.','Recognise effort and results publicly and fairly, at every level.'],
   spine:'Team noticeboard and intercom inside the workspace, with recognition built in.'},
  {k:'experience', name:'Worker and employer experience', pillar:'Pillar 6 · Citizen, Employer and Worker Experience', color:'#2E7D6B',
   re:/\b(worker|employer|complain|client|customer|citizen|jobseeker|job seeker|public|visitor|reception|come back|turned away|disappoint|dissatisf|travel|far|upcountry|district)/i,
   recs:['Publish a service charter: what each service needs, how long it takes, and who to call.','Give workers and employers a way to check case status without travelling to the office.','Set up a simple front desk and feedback channel, and review complaints monthly.'],
   spine:'Public case-status lookup and feedback channel that feeds the same case records.'},
  {k:'resources', name:'Staffing and resources', pillar:'Pillar 2 · Organisation and People', color:'#5D6B65',
   re:/\b(staff shortage|understaff|few officers|short of staff|workload|overwhelm|budget|fund|facilitat|allowance|transport|fuel|vehicle|office space|chairs|desk|structure|establishment|vacanc|recruit|overload|too much work)/i,
   recs:['Compare approved establishment with actual staffing and workload, unit by unit, and present the gap to the PS.','Pool transport and facilitation through a booking schedule so field work is planned, not improvised.','Target scarce inspectors with data, so effort goes where risk is highest.'],
   spine:'Workload and resource view: cases per officer, field schedule, and facilitation requests.'}
];
const PAINS = [
  ['Internet and data', /\b(internet|wifi|wi-fi|network|bundle|data)\b/i],
  ['Computers and printers', /\b(computer|laptop|desktop|printer|scanner|photocop)/i],
  ['Approvals and signatures', /\b(approv|signature|sign off|signs|signed)/i],
  ['Transport and facilitation', /\b(transport|fuel|vehicle|facilitat|allowance)/i],
  ['Too few staff for the work', /\b(staff shortage|understaff|few officers|short of staff|workload|overwhelm|overload|too much work)/i],
  ['Paper files and registers', /\b(paper|register|files?|manual|handwrit)\b/i],
  ['Training and skills', /\b(train|skill|refresher|induction|course)/i],
  ['Waiting on other offices', /\b(wait|waiting|pending|forward|other office|another office|ministry of)/i],
  ['Systems that do not talk to each other', /\b(oshmis|eemis|lmis|system|systems|database)\b/i],
  ['Information is not shared', /\b(communicat|information|not informed|we hear|silo)/i],
  ['Recognition and appreciation', /\b(appreciat|recogni|valued|thank|motivat)/i],
  ['Office space and equipment', /\b(office space|chairs|desk|furniture|cabinet|space)\b/i],
  ['Nobody follows up on performance', /\b(nobody checks|no one checks|follow.?up|supervis|apprais|performance)/i],
  ['Workers and employers keep coming back', /\b(come back|keep coming|travel|upcountry|far|turned away)/i]
];
const POS = /\b(love|proud|enjoy|happy|fulfil|satisf|passion|grateful|good|great|help|helping|rewarding|meaningful|smile)/gi;
const NEG = /\b(hard|difficult|stuck|slow|frustrat|lack|never|poor|delay|problem|challenge|tired|ignored|no |not |cannot|can't|fail|broken|worst|stress)/gi;
function sentences(t){ return String(t||'').replace(/\s+/g,' ').split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s => wc(s) >= 6 && wc(s) <= 60); }
function analyse(rs){
  const subs = rs.filter(r => r.status === 'submitted');
  subs.forEach(r => {
    const all = [1,2,3,4,5,6].map(i => r['a'+i]||'').join(' ');
    r._gaps = {}; GAPS.forEach(g => { const t = [1,3,4,5,6].map(i=>r['a'+i]||'').join(' '); r._gaps[g.k] = g.re.test(t); });
    r._pains = PAINS.filter(p => p[1].test([1,3,5].map(i=>r['a'+i]||'').join(' '))).map(p=>p[0]);
    const pos = (all.match(POS)||[]).length, neg = (all.match(NEG)||[]).length;
    r._sent = pos - neg > 2 ? 'Positive' : neg - pos > 3 ? 'Negative' : 'Mixed';
    r._words = [1,2,3,4,5,6].reduce((a,i)=>a+wc(r['a'+i]),0);
    r._depth = r.depth !== undefined && r.depth !== '' ? Number(r.depth) : depthOf(r);
  });
  return subs;
}
function quotesFor(subs, test, qs, max){
  const out = [];
  subs.forEach(r => (qs||[1,2,3,4,5,6]).forEach(q => sentences(r['a'+q]).forEach(s => { if(!test || test.test(s)) out.push({s, r, q}); })));
  out.sort((a,b) => wc(b.s) - wc(a.s));
  const seen = new Set(), said = new Set(), pick = [];
  for(const o of out){ const key = o.s.toLowerCase().replace(/[^a-z]/g,'').slice(0,60); if(seen.has(o.r.id + o.q) || said.has(key)) continue; seen.add(o.r.id + o.q); said.add(key); pick.push(o); if(pick.length >= (max||6)) break; }
  return pick;
}

    if(r.status==='submitted'){
      if(r.mode==='Interviewer-led'){ r.tier='none'; r.rewardStatus='Not eligible (interviewer-led)'; }
      else { const k = out.filter(x=>x.status==='submitted'&&x.tier&&x.tier!=='none').length; r.tier = r.depth < 75 ? 'office' : (k < 5 ? 'cj' : k < 15 ? 'endiro' : 'office'); r.rewardStatus = r.verified==='no' ? 'Awaiting approval' : (r.tier==='endiro' ? 'Unlocked, voucher to follow' : 'Voucher sent'); if(r.rewardStatus==='Voucher sent') r.voucher = (r.tier==='cj'?'CJ-SAMPLE-':'LEISH-S') + String(i+1).padStart(3,'0'); }
    }
    out.push(r);
  });
  return out;
}

  const go = p => { if(p.view === 'admin') bootAdmin(); else bootParticipant(p.view === 'interview'); };
  if(GAS && google.script.url){ google.script.url.getLocation(loc => { const q = loc.parameter || {}; const h = loc.hash || ''; PARAMS = {view: q.view || (h==='admin'||h==='interview'?h:''), ref: q.ref || ''}; go(PARAMS); }); }
  else go(params());
  window.addEventListener('hashchange', () => location.reload());
})();
